<html lang="zh-Hant">

<head>

<title>多多谷｜每日 Checklist</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f7f8fc;--card:#fff;--text:#30343b;--muted:#7b8290;--line:#eef0f4;--bar:#e9ecf2;--accent:#7b8cff;--disabled:.38;--shadow:0 5px 20px rgba(40,50,80,.07)}
body.dark{--bg:#15171c;--card:#20232a;--text:#f1f3f6;--muted:#a8afbc;--line:#343944;--bar:#343944;--accent:#8f9cff;--disabled:.32;--shadow:0 5px 20px rgba(0,0,0,.22)}
body{margin:0;padding:24px 14px 48px;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.wrap{max-width:760px;margin:auto}
.hero,.section{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.hero{padding:22px;margin-bottom:14px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
h1{margin:0 0 6px;font-size:26px}
.brand-heading{display:flex;align-items:center;gap:10px;line-height:1.15}
.brand-logo{display:block;width:104px;height:52px;object-fit:contain;flex:0 0 auto}
@media(max-width:560px){.brand-logo{width:78px;height:39px}.brand-heading{gap:7px}.brand-heading span{font-size:23px}}
.date{color:var(--muted);font-size:14px}
.theme-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:8px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.control-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
.control-btn:hover,.theme-btn:hover{opacity:.82}
.progress-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.progress-card{background:var(--bg);border-radius:13px;padding:11px 13px}
.progress-card .label{font-size:12px;color:var(--muted);margin-bottom:3px}
.progress-card .value{font-size:16px;font-weight:800}
.bar{height:9px;background:var(--bar);border-radius:99px;margin-top:7px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:.2s}
.remaining{margin-top:12px;padding:11px 13px;border-radius:13px;background:var(--bg);font-size:14px;font-weight:700}
.remaining strong{color:var(--accent)}
.reset{font-size:12px;color:var(--muted);margin-top:10px}
.section{margin-bottom:12px;overflow:hidden}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;cursor:pointer;user-select:none}
.section-title{font-size:18px;font-weight:800}
.arrow{display:inline-block;width:25px;height:13px;font-size:0;color:transparent;background:url("UI/展開.png") center/contain no-repeat;transition:opacity .18s ease;flex:0 0 25px}
.section.closed .arrow{width:25px;height:13px;background-image:url("UI/收起.png");transform:none}
.items{padding:0 12px 10px}
.section.closed .items{display:none}\n.section-head + .items{padding-top:8px}

.section.incomplete .section-head{background:#fff8e8;border-left:4px solid #f2a51a;padding-left:14px}
.section.incomplete .section-title{color:#a86400}
.section.incomplete .summary{color:#c27a00;font-weight:800}
.section.weekly-incomplete .section-head{background:#fff1d6;border-left-color:#f59e0b}
.section.weekly-incomplete .section-title{color:#b45309}
body.dark .section.incomplete .section-head{background:#3a2e1d;border-left-color:#d98d08}
body.dark .section.incomplete .section-title{color:#ffc966}
body.dark .section.incomplete .summary{color:#f0b64d}
body.dark .section.weekly-incomplete .section-head{background:#44301a}
.info-items{padding-top:0}.info-items.closed{display:none}
.item{display:flex;align-items:center;gap:11px;padding:12px 6px;border-top:1px solid var(--line);cursor:pointer} .item.has-ui-icon{gap:9px}.task-ui-icon{width:36px;height:36px;flex:0 0 36px;display:flex;align-items:center;justify-content:center;overflow:hidden}.task-ui-icon img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.item.has-ui-icon .name{flex:1;min-width:0}.ui-title-icon{width:25px;height:25px;flex:0 0 25px;display:inline-flex;align-items:center;justify-content:center}.ui-title-icon img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}.section-title > .ui-title-icon{margin-right:7px;vertical-align:middle}.task-ui-icon.facebook-ui-icon img,.task-ui-icon img[src$="facebook.PNG"]{width:26px !important;height:26px !important;max-width:26px !important;max-height:26px !important;object-fit:contain}.ui-title-icon.facebook-ui-icon img,.ui-title-icon img[src$="facebook.PNG"]{width:18px !important;height:18px !important;max-width:18px !important;max-height:18px !important;object-fit:contain}.promo-name,.reminder-name{display:flex;align-items:center;gap:7px;min-width:0}
.box{width:22px;height:22px;border:2px solid #c7ccd6;border-radius:7px;display:grid;place-items:center;flex:none;font-weight:900}
.done .box{background:#32965b;border-color:#32965b;color:#fff}
.done .name{text-decoration:line-through;color:#548363}
.item.done:not(.boss-item){background:#edf8ef;border-radius:10px}.item.done .box{background: url("UI/任務完成.png") center/contain no-repeat;border-color:transparent;color:transparent}
.item.just-completed{animation:task-complete-in .28s ease-out}
.item.just-completed .box{animation:task-check-pop .3s cubic-bezier(.2,.8,.2,1)}
.boss-item.done .box{background:url("UI/任務完成.png") center/contain no-repeat;border-color:transparent;color:transparent}
.boss-item.just-completed{animation:task-complete-in .28s ease-out}
@keyframes task-complete-in{0%{box-shadow:0 0 0 0 rgba(50,150,91,0)}45%{box-shadow:0 0 0 3px rgba(50,150,91,.18)}100%{box-shadow:inset 3px 0 0 #32965b}}
@keyframes task-check-pop{0%{transform:scale(.72)}65%{transform:scale(1.14)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.item.just-completed,.item.just-completed .box,.boss-item.just-completed{animation:none}}
.done .name{text-decoration:none;color:var(--text)}

.item.boss-item.done{background:#e8f5eb;border:1px solid #78bd8c;box-shadow:inset 3px 0 0 #32965b}
.item.boss-item.done .boss-image{filter:grayscale(.48);opacity:.72}
.item.done:not(.boss-item) .task-ui-icon img{filter:none;opacity:1;transition:filter .18s ease,opacity .18s ease}
.item.boss-item.done .boss-difficulty-image{opacity:1}
body.dark .item.done:not(.boss-item){background:#203629}
body.dark .item.boss-item.done{background:#203629;border-color:#3e8054;box-shadow:inset 3px 0 0 #58b878}
body.dark .done .name{color:#9ad5a8}
.day{margin-left:auto;flex:0 0 58px;text-align:right;color:var(--muted);font-size:12px;white-space:nowrap}.day.long{flex:0 0 200px;text-align:right}
.disabled{opacity:var(--disabled);cursor:default}
.disabled .name{text-decoration:none}
.section-head .summary{margin-left:auto;margin-right:10px;font-size:12px;color:var(--muted)}
.select-all-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:6px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
.select-all-btn:hover{opacity:.82}
.boss-group-title{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 0;padding:9px 8px 7px;border-bottom:1px solid var(--line);font-size:14px;font-weight:800;color:var(--text)}
.boss-group-title span:last-child{font-size:12px;color:var(--muted);font-weight:700}

.promo-wrap{margin:4px 6px 8px;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.promo-title{font-size:14px;font-weight:800;margin-bottom:10px}
.promo-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:9px}
.promo-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.promo-name{font-weight:800;font-size:14px}
.copy-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.copy-btn:hover{opacity:.82}
.promo-text{white-space:pre-wrap;line-height:1.65;font-size:13px;color:var(--text);max-height:220px;overflow:auto}
.promo-links{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.promo-link{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700;text-decoration:none;line-height:1.35;transition:.18s}.promo-link:hover{transform:translateY(-1px)}.promo-link.facebook-link{background:#1877f2;border-color:#1877f2;color:#fff}.promo-link.facebook-link:hover{background:#166fe5;border-color:#166fe5;color:#fff}.promo-link.discord-link{background:#5865f2;border-color:#5865f2;color:#fff}.promo-link.discord-link:hover{background:#4f5be0;border-color:#4f5be0;color:#fff}.dark .promo-link.facebook-link{background:#1877f2;border-color:#1877f2;color:#fff}.dark .promo-link.discord-link{background:#5865f2;border-color:#5865f2;color:#fff}
.promo-link-note{width:100%;font-size:12px;color:var(--muted);font-weight:700}
.reminder-wrap{margin:4px 6px 10px;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.reminder-title{font-size:14px;font-weight:800;margin-bottom:10px}
.reminder-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 108px 12px 12px;margin-top:9px;min-height:92px}.reminder-ui-icon{position:absolute;right:14px;top:auto;bottom:12px;width:80px;height:80px;display:flex;align-items:center;justify-content:center;pointer-events:none}.reminder-ui-icon img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}.reminder-card .reminder-name{min-height:24px}@media(max-width:560px){.reminder-card{padding-right:78px;min-height:76px}.reminder-ui-icon{right:9px;top:auto;bottom:10px;width:60px;height:60px}}
.reminder-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.reminder-name{font-weight:800;font-size:14px}
.reminder-next{position:absolute;top:12px;right:12px;max-width:calc(100% - 24px);text-align:right;font-size:12px;color:var(--accent);font-weight:800}.reminder-countdown{font-variant-numeric:tabular-nums;letter-spacing:.3px}.reminder-countdown.live{color:#e58b18}.reminder-countdown.active{color:#e58b18}.reminder-time.active{color:#e58b18;border-color:#e58b18;background:#fff7e8;font-weight:800}.dark .reminder-time.active{background:#3b2d18;color:#ffc966;border-color:#9a6b20}
.reminder-line{font-size:13px;line-height:1.7;color:var(--text)}
.reminder-label{font-weight:800}
.reminder-times{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.reminder-time{border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:12px;color:var(--muted);background:var(--bg)}
.reminder-time.next{color:var(--accent);border-color:var(--accent);font-weight:800}


.search-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.search-input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:10px 12px;font-size:14px;outline:none}.search-input:focus{border-color:var(--accent)}.favorite-filter{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:10px 12px;font-size:13px;cursor:pointer}.favorite-filter.active{background:var(--accent);color:#fff;border-color:var(--accent)}.item-actions{margin-left:auto;display:flex;align-items:center;gap:7px}.favorite-btn{border:0;background:transparent;color:#c5c9d2;font-size:18px;cursor:pointer;padding:2px 4px;line-height:1}.favorite-btn.active{color:#f5b942}.favorite-btn:hover{transform:scale(1.08)}.yesterday-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}.yesterday-title{font-weight:800;font-size:15px;margin-bottom:8px}.yesterday-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:stretch}
.yesterday-category-card{min-width:0;height:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px}
.yesterday-category-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;line-height:1.3;margin-bottom:7px;color:var(--text)}
.yesterday-category-icon{width:17px;height:17px;flex:0 0 17px;display:inline-flex;align-items:center;justify-content:center}
.yesterday-category-icon img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.yesterday-category-items{display:flex;flex-wrap:wrap;gap:5px}.yesterday-item-icon{width:16px;height:16px;flex:0 0 16px;display:inline-flex;align-items:center;justify-content:center;margin-right:4px}.yesterday-item-icon img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.yesterday-item-icon.facebook-ui-icon img{width:13px !important;height:13px !important;max-width:13px !important;max-height:13px !important;object-fit:contain}
.yesterday-item{display:inline-flex;align-items:center;max-width:100%;font-size:12px;line-height:1.35;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:4px 7px;overflow-wrap:anywhere}
@media(max-width:560px){.yesterday-list{grid-template-columns:minmax(0,1fr)}.yesterday-category-card{padding:8px}.yesterday-category-head{margin-bottom:6px}}.yesterday-empty{color:var(--muted);font-size:13px}.complete-banner{display:none;margin-top:12px;padding:13px;border-radius:13px;background:linear-gradient(135deg,#fff4c8,#f4edff);font-weight:800;text-align:center}.complete-banner.show{display:block}.dark .complete-banner{background:linear-gradient(135deg,#3a3420,#30283f)}.reminder-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}.reminder-toggle{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:5px 9px;font-size:12px;cursor:pointer}.reminder-body.closed{display:none}.reminder-arrow{color:var(--muted);margin-left:6px}.search-empty{text-align:center;color:var(--muted);padding:24px 10px}.favorite-empty{padding:10px 0;color:var(--muted);font-size:13px}.favorite-panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0;margin-bottom:12px;box-shadow:var(--shadow)}.favorite-panel .section-head{padding:16px 18px}.favorite-panel .section-title{font-weight:800;font-size:18px}.favorite-panel .favorite-panel-arrow{display:inline-block;width:25px;height:13px;flex:0 0 25px;font-size:0!important;color:transparent!important;background:url("UI/展開.png") center/contain no-repeat;transition:opacity .18s ease;transform:none!important}.favorite-panel.closed .favorite-panel-arrow{background-image:url("UI/收起.png");transform:none!important}.favorite-panel-body{padding:0 12px 12px;max-height:330px;overflow-y:auto}.favorite-panel-title{font-weight:800;font-size:15px;margin-bottom:10px}.favorite-group{margin-top:8px}.favorite-group-title{font-size:12px;font-weight:800;padding:6px 9px;border-radius:8px;margin-bottom:5px}.favorite-group-title.pending{background:#fff1d6;color:#b45309}.favorite-group-title.finished{background:#edf8ef;color:#278244}.dark .favorite-group-title.pending{background:#44301a;color:#ffc966}.dark .favorite-group-title.finished{background:#203629;color:#8de0a6}.favorite-sync-list{display:flex;flex-wrap:wrap;gap:6px}.favorite-sync-item{display:inline-flex;align-items:center;gap:6px;width:auto;max-width:100%;padding:5px 8px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer}.favorite-sync-icon{width:18px;height:18px;flex:0 0 18px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden}.favorite-sync-icon img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.favorite-sync-icon.facebook-ui-icon img{width:14px !important;height:14px !important;max-width:14px !important;max-height:14px !important;object-fit:contain}.favorite-sync-item:hover{border-color:var(--accent);transform:translateY(-1px)}.favorite-sync-item.done{opacity:.72}.favorite-sync-box{width:15px;height:15px;border:1.5px solid #c7ccd6;border-radius:4px;display:grid;place-items:center;flex:none;font-size:9px;font-weight:900}.favorite-sync-item.done .favorite-sync-box{background:var(--accent);border-color:var(--accent);color:#fff}.favorite-sync-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.favorite-sync-meta{font-size:9px;color:var(--muted);white-space:nowrap}.favorite-sync-item.done .favorite-sync-name{text-decoration:line-through;color:var(--muted)}@media(max-width:560px){body{padding:12px 8px 34px}.hero{padding:17px 14px;border-radius:15px}h1{font-size:21px}.controls{gap:6px}.control-btn{flex:1;padding:9px 7px}.search-row{display:grid;grid-template-columns:1fr}.search-input{min-width:0;width:100%;font-size:16px}.favorite-filter{width:100%}.section-head{padding:14px 12px}.section-title{font-size:15px}.section-head .summary{font-size:11px;margin-right:6px}.select-all-btn{padding:6px 7px;font-size:11px}.item{padding:12px 4px}.name{font-size:14px}.day{font-size:11px;flex-basis:58px}.favorite-btn{font-size:20px}.promo-wrap{margin-left:2px;margin-right:2px;padding:11px}.promo-text{font-size:12px;max-height:260px}.reminder-time{padding:5px 7px}.yesterday-card{border-radius:13px;padding:12px}}


/* 今日冒險：任務清單之外的每日互動與永久成長 */
.adventure-card{margin-top:12px;margin-bottom:12px;padding:14px;border:1px solid #d8c58b;border-radius:15px;background:linear-gradient(135deg,rgba(246,190,66,.13),rgba(123,140,255,.07));box-shadow:var(--shadow);overflow:hidden}
body.dark .adventure-card{border-color:#65502b;background:linear-gradient(135deg,rgba(217,141,8,.13),rgba(143,156,255,.07))}
.adventure-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.adventure-brand{display:flex;align-items:center;gap:10px;min-width:0}
.adventure-spark{display:grid;place-items:center;width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:linear-gradient(135deg,#f8c64e,#ef9826);color:#3b2a08;font-size:24px;box-shadow:0 3px 10px rgba(220,150,30,.22)}
.adventure-title{font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.adventure-kicker{font-size:9px;letter-spacing:1px;color:var(--muted);font-weight:800}
.adventure-subtitle{font-size:11px;color:var(--muted);margin-top:2px}
.adventure-collapse{border:0;background:transparent url("UI/展開.png") center/25px 13px no-repeat;color:transparent;border-radius:9px;padding:8px 14px;font-size:0;cursor:pointer;white-space:nowrap;min-width:32px;min-height:30px}.adventure-card.collapsed .adventure-collapse{background-image:url("UI/收起.png")}
.adventure-content{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:10px}
.adventure-event,.adventure-challenge,.adventure-profile,.adventure-achievements{min-width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px}
.adventure-event{background:linear-gradient(120deg,rgba(255,198,72,.13),var(--card) 75%)}
body.dark .adventure-event{background:linear-gradient(120deg,rgba(217,141,8,.12),var(--card) 75%)}
.adventure-label{font-size:10px;font-weight:900;letter-spacing:.4px;color:var(--muted);margin-bottom:7px}
.adventure-event-title{font-size:15px;font-weight:900;margin-bottom:5px}
.adventure-event-desc{font-size:12px;line-height:1.55;color:var(--muted)}
.adventure-challenge{display:flex;flex-direction:column;gap:7px}
.adventure-challenge-title{font-size:14px;font-weight:900}
.adventure-challenge-desc{font-size:12px;color:var(--muted);line-height:1.45}
.adventure-challenge-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;font-weight:800}
.adventure-challenge-bar,.adventure-level-bar{height:7px;border-radius:99px;background:var(--bar);overflow:hidden}
.adventure-challenge-fill{height:100%;width:0;background:linear-gradient(90deg,#e5a323,#f3c85b);border-radius:99px;transition:width .3s ease}
.adventure-reward{font-size:11px;color:#b77913;font-weight:800}
body.dark .adventure-reward{color:#ffd06b}
.adventure-done-pill{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;padding:4px 7px;border-radius:7px;background:#e7f6eb;color:#217b40;font-size:11px;font-weight:900}
body.dark .adventure-done-pill{background:#203629;color:#8de0a6}
.adventure-profile{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.adventure-level-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

    ["受選的賽蓮（普通）","監視者卡洛斯（普通）","咖凌（普通）","林波（普通）","巴德利斯（普通）","最初的敵對者（普通）","凱伊（普通）"]
  ];

  // V37 已使用穩定 ID；V38 只把新增／更名的 BOSS ID 對應到新名稱。
  const renameMap={
    "粉豆":"粉豆（普通）",
    "拉圖斯":"拉圖斯（簡單）",
    "凡雷恩":"凡雷恩（簡單）",

  };

    "粉豆","拉圖斯","凡雷恩","希拉","阿卡伊農","卡翁","西格諾斯",
    "史烏（普通）","史烏（困難）","戴米安（普通）","戴米安（困難）","露希妲（普通）","露希妲（困難）","威爾（普通）","威爾（困難）","守護天使綠水靈（混沌）","戴斯克（普通）","戴斯克（混沌）","頓凱爾（普通）","頓凱爾（困難）","真‧希拉（普通）","真‧希拉（困難）","受選的賽蓮（普通）","監視者卡洛斯（普通）","咖凌（普通）","林波（普通）","巴德利斯（普通）","最初的敵對者（普通）","凱伊（普通）"
  ]);

  function legacyName(type,si,li){
    if(type==="daily" && si>=0 && si<=4) return sections[si]?.[2]?.[li]?.[0] || null;
    if(type==="daily" && si>=5 && si<=7) return legacyBossSections[si-5]?.[li] || null;
    if(type==="weekly" && si===8) return sections.find(x=>x[1]==="weekly")?.[2]?.[li]?.[0] || null;
    return null;
  }

  function normalizeName(name){
    if(renameMap[name]) return renameMap[name];
    return name;
  }

  function migrateStore(store,type){
    const next={};
    Object.keys(store).forEach(k=>{
      if(k.includes("::")){
        const [t,name]=k.split("::");
        next[k.replace("::"+name,"::"+normalizeName(name))]=store[k];
        return;
      }
      const parts=k.split("_");
      const si=Number(parts[0]), li=Number(parts[1]);
      let name=legacyName(type,si,li);
      if(name) name=normalizeName(name);
      if(name && store[k]) next[taskId(type,name)]=true;
    });
    return next;
  }

  Object.keys(localStorage).forEach(key=>{
    if(key.startsWith("dodogu_daily_")){
      try{ localStorage.setItem(key,JSON.stringify(migrateStore(JSON.parse(localStorage.getItem(key)||"{}"),"daily"))); }catch(e){}

    if(k.includes("::")){
      const [t,name]=k.split("::");
      favNext[taskId(t,normalizeName(name))]=favorites[k];
      return;
    }
    const parts=k.split("_");
    const si=Number(parts[0]), li=Number(parts[1]);
    let type=null;
    if(si>=0 && si<=7) type="daily";
    else if(si===8) type="weekly";
    let name=type?legacyName(type,si,li):null;
    if(name) name=normalizeName(name);
    if(type && name && favorites[k]) favNext[taskId(type,name)]=true;
  });
  localStorage.setItem("dodogu_checklist_favorites",JSON.stringify(favNext));

  // V37 已經把 BOSS 合併成單一「每日 BOSS」分類；V38 只新增／調整子分類內容，不改收合邏輯。
  localStorage.setItem(flag,"1");
}

function recordAdventureTaskCompletion(type,id){
  const period=type==="weekly"?"w:"+weekKey:"d:"+todayKey;
  if(!Array.isArray(adventureProfile.rewardedTasks[period])) adventureProfile.rewardedTasks[period]=[];
  if(adventureProfile.rewardedTasks[period].includes(id)) return;
  adventureProfile.rewardedTasks[period].push(id);
  adventureProfile.totalCompletions+=1;
  adventureProfile.xp+=1;
  const name=String(id).split("::").slice(1).join("::");
  if(isBossTask(name)) adventureProfile.bossCompletions+=1;
  adventureProfile.activeDays[todayKey]=true;
  // 限制去重紀錄大小；永久累計數不會因此減少。
  Object.keys(adventureProfile.rewardedTasks).forEach(key=>{
    const parts=key.split(":");
    const stamp=parts.slice(1).join(":");
    const date=Date.parse(stamp+"T00:00:00");
    const age=(Date.now()-date)/86400000;
    if(Number.isFinite(date)&&((parts[0]==="d"&&age>45)||(parts[0]==="w"&&age>210))) delete adventureProfile.rewardedTasks[key];
  });
  saveAdventureProfile();
}
function adventureLevelForXP(xp){
  let level=1;
  while(level<100 && xp>=30*level*(level+1)/2) level++;
  const currentFloor=30*(level-1)*level/2;
  const nextFloor=30*level*(level+1)/2;
  const names=["","初出茅廬","任務新手","冒險學徒","任務達人","BOSS 獵手","冒險專家","傳奇冒險者","多多英雄","傳說冒險者","永恆探索者"];
  return {level,title:names[level]||"傳奇冒險者",currentFloor,nextFloor,progress:Math.max(0,Math.min(100,(xp-currentFloor)/(nextFloor-currentFloor)*100))};
}
function getTodayAdventureChallenge(){
  const dayIndex=Math.floor(Date.parse(todayKey+"T00:00:00Z")/86400000);
  const challenge=ADVENTURE_CHALLENGES[((dayIndex%ADVENTURE_CHALLENGES.length)+ADVENTURE_CHALLENGES.length)%ADVENTURE_CHALLENGES.length];
  let progress=0;
  sections.forEach(([title,type,items])=>{
    const store=type==="weekly"?weekly:daily;
    items.forEach(([name,daysText,days])=>{
      const available=type==="weekly"||!days||days.includes(now.getDay());
      if(!available||!store[taskId(type,name)]) return;
      if(challenge.kind==="daily"&&type==="daily") progress++;
      else if(challenge.kind==="weekly"&&type==="weekly") progress++;
      else if(challenge.kind==="boss"&&title==="每日 BOSS") progress++;
      else if(challenge.kind==="section"&&title===challenge.section) progress++;
    });
  });
  return {...challenge,progress:Math.min(progress,challenge.target),rawProgress:progress,done:progress>=challenge.target};
}

  return Number(adventureProfile[metric]||0);

function getNextDateTime(times, now){
  let bestDate=null;
  let bestTime="";
  times.forEach(t=>{
    const [h,m]=t.split(":").map(Number);
    const candidate=new Date(now);
    candidate.setHours(h,m,0,0);
    if(candidate<=now) candidate.setDate(candidate.getDate()+1);
    if(!bestDate || candidate<bestDate){bestDate=candidate;bestTime=t;}
  });
  return {date:bestDate,time:bestTime};
}
function getActiveDateTime(times, now, durationMinutes){
  let active=null;
  times.forEach(t=>{
    const [h,m]=t.split(":").map(Number);
    for(const offset of [0,-1]){
      const start=new Date(now);
      start.setDate(start.getDate()+offset);
      start.setHours(h,m,0,0);
      const end=new Date(start.getTime()+durationMinutes*60000);
      if(start<=now && now<end){
        if(!active || start>active.start) active={start,end,time:t};
      }
    }
  });
  return active;
}
function formatCountdown(ms){
  const total=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(total/3600);
  const m=Math.floor((total%3600)/60);
  const s=total%60;
  return `${String(h).padStart(2,"0")} 小時 ${String(m).padStart(2,"0")} 分 ${String(s).padStart(2,"0")} 秒`;
}

function getNextTime(times, now){
  const currentMinutes = now.getHours()*60 + now.getMinutes();
  let best = null;
  let bestDiff = Infinity;
  times.forEach(t=>{
    const [h,m] = t.split(":").map(Number);
    const target = h*60 + m;
    let diff = target - currentMinutes;
    if(diff < 0) diff += 24*60;
    if(diff < bestDiff){ bestDiff = diff; best = t; }
  });
  return {time: best, diff: bestDiff};
}

          el.innerHTML=`<span class="reminder-countdown active">🔔 目前開放　剩餘 ${formatCountdown(remaining)}</span>`;
        }else{
          const next=getNextDateTime(times,current);
          const diff=next.date-current;
          el.innerHTML=`下一次 ${next.time}　<span class="reminder-countdown">${formatCountdown(diff)}</span>`;
        }
      });
    };
    Object.entries(schedules).forEach(([id,config])=>{
      const times=config.times;
      const active=getActiveDateTime(times,now2,config.duration);
      const next=getNextTime(times,now2);
      const te=info.querySelector("#"+id+"Times");
      times.forEach(t=>{
        const isActive=active && t===active.time;
        const isNext=!active && t===next.time;
        const sp=document.createElement("span");
        sp.className="reminder-time"+(isActive?" active":(isNext?" next":""));
        sp.textContent=t;
        te.appendChild(sp);
      });
    });
    updateReminderCountdown();
    reminderCountdownTimer=setInterval(updateReminderCountdown,1000);
    info.querySelector(".section-head").onclick=()=>{
      const c=info.classList.toggle("closed");
      localStorage.setItem("dodogu_reminder_closed",c?"1":"0");
    };
    app.appendChild(info);
  }

  sections.forEach((section, sectionIndex)=>{
    const [title,type,items]=section;
    const store = type==="weekly" ? weekly : daily;
    const storageKey = type==="weekly" ? "dodogu_weekly_"+weekKey : "dodogu_daily_"+todayKey;
    let doneInSection=0, activeTotal=0, visibleItems=[];
    items.forEach(([name,daysText,days,dayStyle,group],localIndex)=>{
      const available=!days || days.includes(now.getDay());
      if(available) activeTotal++;
      const id=taskId(type,name);
      if(available && store[id]) doneInSection++;
      if(type==="daily" && available && !store[id]) remaining.push({section:title,name,daysText});
      const matches=!query || name.toLowerCase().includes(query) || title.toLowerCase().includes(query);
      const favMatch=!onlyFavorites || !!favorites[id];
      if(matches && favMatch) visibleItems.push({name,daysText,days,localIndex,id,dayStyle:dayStyle||"",group:group||""});
    });
    if(type==="weekly"){ weeklyDone+=doneInSection; weeklyTotal+=items.length; }
    else { dailyDone+=doneInSection; dailyTotal+=activeTotal; }
    if((query||onlyFavorites) && visibleItems.length===0) return;

    const totalInSection=type==="daily"?activeTotal:items.length;
    const allChecked=totalInSection>0&&doneInSection===totalInSection;
    const incomplete=totalInSection>0 && !allChecked;
    const card=document.createElement("div");
    card.className="section category-card"+(foldState[sectionIndex] ? " closed" : "")+(incomplete ? " incomplete" : "")+(incomplete && type==="weekly" ? " weekly-incomplete" : "");
    card.dataset.category=title;
    card.dataset.section=sectionIndex;
    const head=document.createElement("div"); head.className="section-head";
    head.innerHTML=`<span class="section-title">${title}</span><span class="summary">${doneInSection} / ${totalInSection}</span><button class="select-all-btn" type="button">${allChecked?"↩ 全部取消":"☑ 全選"}</button><span class="arrow">⌄</span>`;
    addSectionTitleIcon(head.querySelector(".section-title"), title);
    const selectAllBtn=head.querySelector(".select-all-btn");
    selectAllBtn.onclick=(e)=>{e.stopPropagation();items.forEach(([name,daysText,days],li)=>{const available=!days||days.includes(now.getDay());if(available){const id=taskId(type,name);if(!allChecked&&!store[id])recordAdventureTaskCompletion(type,id);store[id]=!allChecked;}});localStorage.setItem(storageKey,JSON.stringify(store));render();};
    const body=document.createElement("div");body.className="items";
    const appendTaskRow=({name,daysText,days,id,dayStyle})=>{
      const available=!days||days.includes(now.getDay()); const checked=!!store[id]; const isFav=!!favorites[id];
      const uiIconFile=UI_ICON_MAP[name]||null;
      const row=document.createElement("div");row.className="item"+(uiIconFile?" has-ui-icon":"")+(checked?" done":"")+(!available?" disabled":"")+(checked&&pendingCompletionAnimationId===id?" just-completed":"");
      row.innerHTML=`<div class="box">${checked?"✓":""}</div>${uiIconFile?`<span class="task-ui-icon"><img src="${UI_ICON_BASE+uiIconFile}" alt="" loading="lazy" decoding="async"></span>`:""}<div class="name">${name}</div>${daysText?`<div class="day ${dayStyle||""}">${daysText}</div>`:""}<div class="item-actions"><button class="favorite-btn ${isFav?"active":""}" type="button" title="${isFav?"取消最愛":"加入最愛／置頂"}">${isFav?"★":"☆"}</button></div>`;
      const favBtn=row.querySelector(".favorite-btn");
      favBtn.onclick=(e)=>{e.stopPropagation();favorites[id]=!favorites[id];if(!favorites[id])delete favorites[id];localStorage.setItem("dodogu_checklist_favorites",JSON.stringify(favorites));render();};
      if(available) row.onclick=()=>{const nextChecked=!store[id];pendingCompletionAnimationId=nextChecked?id:null;if(nextChecked)recordAdventureTaskCompletion(type,id);store[id]=nextChecked;localStorage.setItem(storageKey,JSON.stringify(store));render();pendingCompletionAnimationId=null;};
      return row;
    };
    const appendBossTaskRow=(x)=>{
      const checked=!!store[x.id],isFav=!!favorites[x.id],base=getBossBaseName(x.name),difficulty=getBossDifficultyCode(x.name);
      const imgPath=BOSS_IMAGE_MAP[base],difficultyPath=BOSS_DIFFICULTY_IMAGE_MAP[difficulty];
      const row=document.createElement("div");row.className="item boss-item"+(checked?" done":"")+(checked&&pendingCompletionAnimationId===x.id?" just-completed":"");
      row.innerHTML=`<div class="box">${checked?"✓":""}</div><img class="boss-image" src="${imgPath}" alt="${base}" title="${base}" loading="lazy"><img class="boss-difficulty-image" src="${difficultyPath}" alt="${difficulty}" title="${difficulty}" loading="lazy"><div class="item-actions"><button class="favorite-btn ${isFav?"active":""}" type="button" title="${isFav?"取消最愛":"加入最愛／置頂"}">${isFav?"★":"☆"}</button></div>`;
      row.querySelector(".favorite-btn").onclick=(e)=>{e.stopPropagation();favorites[x.id]=!favorites[x.id];if(!favorites[x.id])delete favorites[x.id];localStorage.setItem("dodogu_checklist_favorites",JSON.stringify(favorites));render();};
      row.onclick=()=>{const nextChecked=!store[x.id];pendingCompletionAnimationId=nextChecked?x.id:null;if(nextChecked)recordAdventureTaskCompletion(x.type,x.id);store[x.id]=nextChecked;localStorage.setItem(storageKey,JSON.stringify(store));render();pendingCompletionAnimationId=null;};
      return row;
    };
    if(title==="每日 BOSS" || title==="每週任務"){
      const bossItems=visibleItems.filter(x=>isBossTask(x.name)).map(x=>({...x,group:x.group||getBossGroupForName(x.name)}));
      const ordinaryItems=visibleItems.filter(x=>!isBossTask(x.name));
      if(ordinaryItems.length) ordinaryItems.forEach(x=>body.appendChild(appendTaskRow(x)));
      if(bossItems.length){
        const allBossItems=items.filter(x=>isBossTask(x[0])).map(([name,daysText,days,dayStyle,group])=>({name,id:taskId(type,name),group:group||getBossGroupForName(name)}));
        const availableGroups=BOSS_GROUP_LABELS.filter(group=>allBossItems.some(x=>x.group===group));
        const activeGroupKey=BOSS_ACTIVE_GROUP_KEYS[type];
        let activeGroup=bossActiveGroups[type]||localStorage.getItem(activeGroupKey);
        // 每日與每週使用不同的選擇狀態；若記錄的分類在該區塊沒有項目，就切到第一個有資料的分類。
        if(!availableGroups.includes(activeGroup)) activeGroup=availableGroups[0]||null;
        body.appendChild(makeBossTabs(allBossItems,store,activeGroup,(group)=>{bossActiveGroups[type]=group;localStorage.setItem(activeGroupKey,group);render();}));
        const grid=document.createElement("div");grid.className="boss-grid";
        const filtered=bossItems.filter(x=>x.group===activeGroup);
        if(filtered.length) filtered.forEach(x=>grid.appendChild(appendBossTaskRow(x)));
        else if(!activeGroup){const empty=document.createElement("div");empty.className="boss-empty";empty.textContent="目前沒有符合條件的 BOSS";grid.appendChild(empty);}
        else {const empty=document.createElement("div");empty.className="boss-empty";empty.textContent="此分類目前沒有符合條件的 BOSS";grid.appendChild(empty);}
        body.appendChild(grid);
      }
    } else {
      visibleItems.forEach(x=>body.appendChild(appendTaskRow(x)));
    }
    head.onclick=()=>{foldState[sectionIndex]=!foldState[sectionIndex];saveFolds();card.classList.toggle("closed",!!foldState[sectionIndex]);};
    card.appendChild(head);card.appendChild(body);

    if(title==="每日推廣"){
      const promo=document.createElement("div");promo.className="promo-wrap";
      promo.innerHTML=`<div class="promo-title">📋 每日推廣文案｜今日日期：${getPromoDateCode()}</div><div class="promo-card"><div class="promo-top"><div class="promo-name">Facebook</div><button class="copy-btn" type="button">📋 複製文案</button></div><div class="promo-text"></div><div class="promo-links"><a class="promo-link facebook-link" href="https://www.facebook.com/share/p/18pPTJDS5f/" target="_blank" rel="noopener noreferrer">↗ Facebook ①</a><a class="promo-link facebook-link" href="https://www.facebook.com/groups/LAMAMS/permalink/27367622866227656?locale=zh_TW" target="_blank" rel="noopener noreferrer">↗ Facebook ②</a></div></div><div class="promo-card"><div class="promo-top"><div class="promo-name">Discord</div><button class="copy-btn" type="button">📋 複製文案</button></div><div class="promo-text"></div><div class="promo-links"><div class="promo-link-note">從以下 3 個頻道任選 2 個推廣</div><a class="promo-link discord-link" href="https://discord.com/channels/1034968130230964315/1057752422988128276" target="_blank" rel="noopener noreferrer">↗ Discord ①</a><a class="promo-link discord-link" href="https://discord.com/channels/1027069828294520873/1071953075964760164" target="_blank" rel="noopener noreferrer">↗ Discord ②</a><a class="promo-link discord-link" href="https://discord.com/channels/1342112035843870840/1488509497264574584" target="_blank" rel="noopener noreferrer">↗ Discord ③</a></div></div><div class="promo-card"><div class="promo-top"><div class="promo-name">多多谷五星好評</div><button class="copy-btn" type="button">📋 複製文案</button></div><div class="promo-text"></div></div>`;
      const promoIconMap={"Facebook":"facebook.PNG","Discord":"discord、五星好評.PNG","多多谷五星好評":"discord、五星好評.PNG"};
      promo.querySelectorAll(".promo-name").forEach(el=>addNamedUiIcon(el,promoIconMap[el.textContent.trim()]));
      const texts=getPromoTexts();const blocks=promo.querySelectorAll(".promo-text");blocks[0].textContent=texts.facebook;blocks[1].textContent=texts.discord;blocks[2].textContent=texts.review;const btns=promo.querySelectorAll(".copy-btn");btns[0].onclick=e=>{e.stopPropagation();copyPromo("facebook",btns[0]);};btns[1].onclick=e=>{e.stopPropagation();copyPromo("discord",btns[1]);};btns[2].onclick=e=>{e.stopPropagation();copyPromo("review",btns[2]);};body.appendChild(promo);
    }

    app.appendChild(card);
  });


  if((query||onlyFavorites) && !app.querySelector(".section")){const empty=document.createElement("div");empty.className="yesterday-card search-empty";empty.textContent=onlyFavorites?"目前還沒有加入最愛的任務 ⭐":"找不到符合條件的任務 🔍";app.appendChild(empty);}
  document.getElementById("dailyCount").textContent=`${dailyDone} / ${dailyTotal}`;
  document.getElementById("weeklyCount").textContent=`${weeklyDone} / ${weeklyTotal}`;
  document.getElementById("dailyFill").style.width=(dailyTotal?dailyDone/dailyTotal*100:0)+"%";
  document.getElementById("weeklyFill").style.width=(weeklyTotal?weeklyDone/weeklyTotal*100:0)+"%";
  document.getElementById("remaining").innerHTML=remaining.length?`🟢 今日還有 <strong>${remaining.length}</strong> 項任務尚未完成`:`🎉 今日任務全部完成！`;
  document.getElementById("completeBanner").classList.toggle("show",dailyTotal>0&&dailyDone===dailyTotal);
  renderAdventure(dailyDone,dailyTotal);
  const ff=document.getElementById("favoriteFilter");ff.classList.toggle("active",onlyFavorites);ff.textContent=onlyFavorites?"⭐ 顯示全部任務":"⭐ 只看最愛";
}

const searchInput=document.getElementById("taskSearch");
if(searchInput){searchInput.addEventListener("input",()=>render());}

if(favoriteFilter){favoriteFilter.onclick=()=>{const on=localStorage.getItem("dodogu_favorite_filter")==="1";localStorage.setItem("dodogu_favorite_filter",on?"0":"1");render();};}

// 🔔 活動提醒：瀏覽器開啟頁面時，在活動開始時間提示一次。
const NOTIFY_KEY = "dodogu_activity_notify";
const NOTIFY_SENT_KEY = "dodogu_activity_notify_sent";
const ACTIVITY_SCHEDULES = [
  {name:"流浪商人", times:["09:00","13:00","17:00","21:00","01:00"]},
  {name:"世界秘寶", times:["10:00","14:00","18:00","22:00"]}
];
function notifyToast(msg){
  const el=document.getElementById("notifyToast"); if(!el) return;
  el.textContent=msg; el.classList.add("show");
  clearTimeout(window.__dodoguToastTimer);
  window.__dodoguToastTimer=setTimeout(()=>el.classList.remove("show"),5000);
}
function updateNotifyButton(){
  const b=document.getElementById("notifyBtn"); if(!b) return;
  const on=localStorage.getItem(NOTIFY_KEY)==="1";
  b.classList.toggle("on",on);
  b.textContent=on?"🔕 關閉活動提醒":"🔔 開啟活動提醒";
}
async function toggleActivityNotify(){
  const on=localStorage.getItem(NOTIFY_KEY)==="1";
  if(on){
    localStorage.setItem(NOTIFY_KEY,"0");
    updateNotifyButton();
    notifyToast("🔕 活動提醒已關閉");
    return;
  }
  if(!("Notification" in window)){notifyToast("此瀏覽器不支援通知功能");return;}
  if(Notification.permission==="denied"){notifyToast("通知權限已被封鎖，請至瀏覽器設定重新允許");return;}
  const permission=Notification.permission==="granted"?"granted":await Notification.requestPermission();
  if(permission!=="granted"){notifyToast("未取得通知權限");return;}
  localStorage.setItem(NOTIFY_KEY,"1");
  updateNotifyButton();
  notifyToast("🔔 活動提醒已開啟！");
}
function checkActivityNotify(){
  if(localStorage.getItem(NOTIFY_KEY)!=="1" || !window.Notification || Notification.permission!=="granted") return;
  const d=new Date(), hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  const day=d.toLocaleDateString("sv-SE");
  const sent=JSON.parse(localStorage.getItem(NOTIFY_SENT_KEY)||"{}");
  ACTIVITY_SCHEDULES.forEach(x=>{
    if(!x.times.includes(hm)) return;
    const key=day+"_"+x.name+"_"+hm;
    if(sent[key]) return;
    sent[key]=1; localStorage.setItem(NOTIFY_SENT_KEY,JSON.stringify(sent));
    const body=x.name==="世界秘寶"?"世界秘寶現在開始！快根據線索尋找秘寶蹤跡 🎁":"流浪商人現在出現！快前往各村莊、城鎮看看吧 🧳";
    new Notification("🔔 多多谷活動提醒",{body});
    notifyToast("🔔 "+x.name+" 開始了！");
  });
}
document.getElementById("notifyBtn")?.addEventListener("click",toggleActivityNotify);
updateNotifyButton();
checkActivityNotify();
setInterval(checkActivityNotify,15000);

// 使用 JSON 讀取既有首頁 "/" 統計，不使用 visit_count，因此不會產生大型計數框。
// count.js 已在 <head> 載入一次，這裡只讀取統計資料。
const FIVE_STAR_REVIEW_TEXT = `多多谷 ฅ^•ﻌ•^ฅ｜把每一次成長，都變成下一次期待！

這裡沒有固定的玩法答案。
從裝備、強化、輪迴，到天賦、陣營與各種特殊玩法，

想競爭 → BOSS、排名、陣營玩法
想輕鬆玩 → 活動、掛機、社群交流

不只是讓你畢業，而是讓你在每個階段，都還有下一個目標。
找到自己的玩法，慢慢玩、一直變強。
多多谷，現在就出發！`;

const GOATCOUNTER_CODE = "duoduovalley";

async function initAnalytics(){
  const todayEl = document.getElementById("todayVisitors");
  const totalEl = document.getElementById("totalVisitors");
  if(!todayEl || !totalEl) return;

  const today = new Date().toISOString().slice(0,10);
  const path = window.location.pathname || "/";
  const pathEncoded = encodeURIComponent(path);
  const todayUrl = "https://" + GOATCOUNTER_CODE + ".goatcounter.com/counter/" + pathEncoded + ".json?start=" + today;
  const totalUrl = "https://" + GOATCOUNTER_CODE + ".goatcounter.com/counter/" + pathEncoded + ".json";

  try{
    const [todayRes,totalRes] = await Promise.all([
      fetch(todayUrl,{cache:"no-store"}),
      fetch(totalUrl,{cache:"no-store"})
    ]);
    if(!todayRes.ok || !totalRes.ok) throw new Error("GoatCounter statistics unavailable");
    const [todayData,totalData] = await Promise.all([todayRes.json(),totalRes.json()]);
    todayEl.textContent = todayData.count ?? "0";
    totalEl.textContent = totalData.count ?? "0";
  }catch(err){
    console.warn("GoatCounter 瀏覽統計載入失敗：",err);
    todayEl.textContent = "—";
    totalEl.textContent = "—";
  }
}

initAnalytics();

render();

setInterval(()=>{
  if(new Date().toLocaleDateString("sv-SE") !== todayKey) location.reload();
},30000);
